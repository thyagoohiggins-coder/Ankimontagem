<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Montador de Flashcards</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">🗂️ Montador de Flashcards</div>
    <div class="top-actions">
      <button id="btn-new-root" class="btn primary">+ Novo card raiz</button>
      <button id="btn-export" class="btn">Exportar</button>
      <label class="btn">Importar<input id="input-import" type="file" accept="application/json" hidden></label>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <section>
        <h3>Cards raiz</h3>
        <ul id="root-list" class="root-list"></ul>
      </section>
      <section>
        <h3>Árvore de aprofundamento</h3>
        <div id="tree" class="tree"></div>
      </section>
    </aside>

    <main id="main" class="main"></main>
  </div>

  <!-- Resumo -->
  <div id="summary-modal" class="modal hidden">
    <div class="modal-box">
      <button class="modal-close" data-close>&times;</button>
      <div id="summary-content"></div>
    </div>
  </div>

  <!-- Estudo -->
  <div id="study" class="study hidden">
    <div class="study-top">
      <span id="study-progress"></span>
      <span id="study-path" class="study-path"></span>
      <button id="study-exit" class="btn">Sair ✕</button>
    </div>
    <div class="study-card" id="study-card">
      <div class="study-side-label" id="study-side-label">FRONT</div>
      <div class="study-content rich" id="study-front"></div>
      <div class="study-content rich back-content hidden" id="study-back"></div>
    </div>
    <div class="study-controls">
      <button id="study-prev" class="btn">← Anterior</button>
      <button id="study-flip" class="btn primary">Virar (espaço)</button>
      <button id="study-next" class="btn">Próximo →</button>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
