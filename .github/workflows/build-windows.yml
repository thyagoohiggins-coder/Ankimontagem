name: Gerar programa Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag da release (ex.: v1.0.0). Vazio = só gerar os .exe"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx electron-builder --win nsis portable --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Montador-de-Flashcards-Windows
          path: |
            dist/*.exe

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Montador de Flashcards ${{ inputs.release_tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.exe
